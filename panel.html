<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Jira Automation</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <style>
    body { font-family: sans-serif; padding: 8px; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: #f4f4f4; padding: 8px; }
  </style>
</head>
<body>
  <h3>Jira Automation – Diagnose</h3>
  <button id="selection">Auswahl analysieren</button>
  <pre id="result">Wähle eine Jira-Karte aus und klicke den Button.</pre>

  <script>
    document.getElementById("selection").addEventListener("click", async () => {
      const out = document.getElementById("result");
      try {
        const selection = await miro.board.getSelection();
        if (selection.length === 0) {
          out.textContent = "Nichts ausgewählt.";
          return;
        }
        const infos = [];
        for (const item of selection) {
          let frameTitle = null;
          if (item.parentId) {
            const parent = await miro.board.getById(item.parentId);
            frameTitle = parent.title ?? null;
          }
          infos.push({ frameTitle, item });
        }
        out.textContent = JSON.stringify(infos, null, 2);
      } catch (err) {
        out.textContent = "Fehler: " + err.message;
      }
    });
  </script>
</body>
</html>
