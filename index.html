<!DOCTYPE html>
<html>
 
<head>
<title>Jira Automation</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script
 
<h1>Jira Automation läuft 🚀</h1>
 
<button id="selection">
Aktuelle Auswahl anzeigen
</button>
 
<p>Meine erste Miro App</p>
 
<script>
 
document
.getElementById("selection")
.addEventListener("click", async () => {
 
const selection =
await miro.board.getSelection()
 
console.log(selection)
 
alert(
`${selection.length} Elemente ausgewählt`
)
})
 
</script>
 
</body>
 
</html>
