<!DOCTYPE html>
<html>
<head>
<title>Jira Automation</title>
 
<script src="https://miro.com/app/static/sdk/v2/miro.jsd>
<body>
 
<h2>Jira Automation</h2>
 
<button id="selection">
Aktuelle Auswahl anzeigen
</button>
 
<script>
 
document
.getElementById("selection")
.addEventListener("click", async () => {
 
const selection =
await miro.board.getSelection()
 
console.log(selection)
 
alert(
`${selection.length} Elemente ausgewählt`
)
})
 
</script>
 
</body>
</html>
